<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Call Guard</title><style>html,body{margin:0;height:100%;background:#0b0b0a;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>(function runEngine(canvas, cfg){
  const ctx=canvas.getContext('2d');
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  let cx=0,cy=0,R3=0,t=0;
  const CAM=820,F=820;
  const FAM='"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,sans-serif';
  let FS=44;
  const PD=1.7, STAG=0.22, NARROW=0.74, WIDE=1.28;
  let storm=0.1, stormTarget=0.1, stormTimer=40, load=0, coh=0;
  const M=()=>cfg.main.join(','), IM=()=>cfg.impact.join(',');
  const BG=()=> cfg.mode==='dark' ? '#0b0b0a' : '#f3f1ed';

  const OW=720, OH=150;
  const txt=document.createElement('canvas'), tctx=txt.getContext('2d');
  const mk=document.createElement('canvas'),  mctx=mk.getContext('2d');
  const scv=document.createElement('canvas'), scx=scv.getContext('2d');   // galaxy bloom buffer
  function sizeOff(){ txt.width=OW*DPR; txt.height=OH*DPR; tctx.setTransform(DPR,0,0,DPR,0,0); mk.width=OW*DPR; mk.height=OH*DPR; mctx.setTransform(DPR,0,0,DPR,0,0); }
  sizeOff();

  function resize(){
    W=canvas.clientWidth||canvas.width; H=canvas.clientHeight||canvas.height;
    canvas.width=W*DPR; canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    scv.width=W*DPR; scv.height=H*DPR; scx.setTransform(DPR,0,0,DPR,0,0);
    cx=W/2; cy=H/2; R3=Math.min(W,H)*0.24;
    layoutPhone();
  }

  function randPhone(){
    const a=['212','415','310','646','305','617','512','206','312','718'];
    const ac=a[Math.floor(Math.random()*a.length)];
    return ac+' '+(200+Math.floor(Math.random()*700))+'-'+(1000+Math.floor(Math.random()*9000));
  }
  let phone=randPhone(), chars=[], cw=[], numW=0;
  function layoutPhone(){
    chars=phone.split('');
    mctx.setTransform(DPR,0,0,DPR,0,0);
    mctx.font='400 44px '+FAM;
    const w44=chars.map(c=>mctx.measureText(c).width);
    const sum44=w44.reduce((a,b)=>a+b,0)||1;
    FS=44*Math.min(1,(2*R3*0.72)/(sum44*WIDE));
    cw=w44.map(w=>w*FS/44);
    numW=cw.reduce((a,b)=>a+b,0);
  }

  function proj(x,y,z){const dz=CAM-z;if(dz<=1)return null;const s=F/dz;return {x:cx+x*s,y:cy+y*s,s:s};}
  function unitDir(){let x=Math.random()*2-1,y=Math.random()*2-1,z=Math.random()*2-1;const m=Math.hypot(x,y,z)||1;return [x/m,y/m,z/m];}
  function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}

  const attackers=[], sparks=[], numlit=[], ripples=[];
  const speck=[];
  function hueOf(c){const r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return h;}
  for(let i=0;i<150;i++){ speck.push({x:Math.random()*OW, y:OH/2+(Math.random()-0.5)*78, r:0.8+Math.random()*2.4, a:0.4+Math.random()*0.5}); }

  // structured galaxy: latitude rings (denser equator) + volumetric dust
  const PI2=Math.PI*2, ring=[];
  const LAT=22;
  for(let ri=0;ri<LAT;ri++){
    const lat=-Math.PI/2+(ri+0.5)/LAT*Math.PI, cl=Math.cos(lat), sl=Math.sin(lat);
    const cols=Math.max(5,Math.round(42*cl));
    for(let ci=0;ci<cols;ci++){
      const lon=ci/cols*PI2+Math.random()*0.04;
      const dir=[cl*Math.cos(lon),sl,cl*Math.sin(lon)];
      ring.push({dir,cx:dir[0],cy:dir[1],cz:dir[2],dust:false,rr:1,ph:Math.random()*PI2,bw:0.6+Math.random()*0.6,off:0,v:0,hit:0});
    }
  }
  for(let k=0;k<1600;k++){
    const u=Math.random()*PI2, vv=Math.acos(2*Math.random()-1), rr=0.32+0.66*Math.random();
    const dir=[Math.sin(vv)*Math.cos(u),Math.cos(vv),Math.sin(vv)*Math.sin(u)];
    ring.push({dir,cx:dir[0],cy:dir[1],cz:dir[2],dust:true,rr,ph:Math.random()*PI2,bw:0.5+0.6*Math.random(),off:0,v:0,hit:0});
  }
  const neb=[{o:0},{o:2.1},{o:4.2}];

  function dentShield(n,power){
    for(const p of ring){
      const dot=p.cx*n[0]+p.cy*n[1]+p.cz*n[2];   // current (rotated) position
      if(dot>0.5){ const k=Math.pow((dot-0.5)/0.5,1.4); p.v-=power*k; p.hit=Math.min(1,p.hit+k*0.8); }
    }
  }
  function drawShield(){
    const mc=M();
    // drifting nebula glow
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const nb of neb){
      const nx=cx+Math.sin(t*0.004+nb.o)*R3*0.5, ny=cy+Math.cos(t*0.0035+nb.o*1.3)*R3*0.45, rr=R3*0.95;
      const g=ctx.createRadialGradient(nx,ny,2,nx,ny,rr);
      g.addColorStop(0,'rgba('+mc+',0.05)'); g.addColorStop(1,'rgba('+mc+',0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(nx,ny,rr,0,PI2); ctx.fill();
    }
    ctx.restore();

    // advance ripples (force spreading across the surface)
    for(let i=ripples.length-1;i>=0;i--){ if(ripples[i].age>150) ripples.splice(i,1); else ripples[i].age++; }

    // slow spin about a tilted axis
    const spin=t*0.004, cs=Math.cos(spin), ss=Math.sin(spin), tlt=0.42, ct=Math.cos(tlt), st=Math.sin(tlt);
    scx.clearRect(0,0,W,H); scx.globalCompositeOperation='lighter';
    for(const p of ring){
      p.v += -p.off*0.09; p.v *= 0.82; p.off += p.v; p.hit *= 0.90;
      let x=p.dir[0], y=p.dir[1], z=p.dir[2];
      const x1=x*cs+z*ss, z1=-x*ss+z*cs;            // spin (Y axis)
      const y2=y*ct - z1*st, z2=y*st + z1*ct;       // tilt (X axis)
      p.cx=x1; p.cy=y2; p.cz=z2;
      // water-like ripple: a crest that travels outward from each strike
      let rip=0, ripBr=0;
      for(const rp of ripples){
        let dt=x1*rp.nx+y2*rp.ny+z2*rp.nz; dt=dt<-1?-1:dt>1?1:dt;
        const ang=Math.acos(dt), front=rp.age*0.020, d=ang-front;
        const env=Math.exp(-(d*d)/0.05), decay=Math.max(0,1-rp.age/130);
        rip += R3*0.08*decay*env; ripBr += env*decay*0.55;
      }
      const baseFrac=p.dust?p.rr:1.0;
      const restR=R3*baseFrac, tightR=R3*0.82*baseFrac;
      const rad=restR+(tightR-restR)*coh + p.off + rip + Math.sin(t*0.016+p.ph)*(R3*0.03)*(1-coh);
      const a=proj(x1*rad,y2*rad,z2*rad); if(!a) continue;
      const depth=Math.max(0.3,Math.min(1.7,a.s));
      const facing=(z2+1)/2, fF=z2>0?1:0.45;
      const tw=0.4+0.6*(0.5+0.5*Math.sin(t*0.3+p.ph));
      const br=(0.30+0.4*coh)*p.bw*tw*fF + 0.25*coh*facing + p.hit + ripBr*fF;
      if(br<0.02) continue;
      scx.fillStyle='rgba('+mc+','+Math.min(1,br)+')';
      const s=(p.dust?1.3:1.7)*depth*(0.9+0.2*coh);
      scx.fillRect(a.x,a.y,s,s);
    }
    // bloom: soft blurred pass + crisp pass
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.filter='blur(6px)'; ctx.globalAlpha=0.5; ctx.drawImage(scv,0,0,W,H);
    ctx.filter='none'; ctx.globalAlpha=1; ctx.drawImage(scv,0,0,W,H);
    ctx.restore();
  }

  function spawn(){
    const u=unitDir();                       // full 3D direction -> varied approach angles
    const dist=R3*(2.4+Math.random()*1.6);
    const sp=0.9+Math.random()*1.8;          // gentle slow drift
    return {x:u[0]*dist,y:u[1]*dist,z:u[2]*dist,vx:-u[0]*sp,vy:-u[1]*sp,vz:-u[2]*sp,
            digit:String(Math.floor(Math.random()*10)), rot:Math.random()*6.2832, rv:(Math.random()-0.5)*0.12, fsv:0.75+Math.random()*0.5};
  }
  for(let i=0;i<2;i++)attackers.push(spawn());

  function explode(px,py,pz){
    load=Math.min(1.8, load+0.09);
    const m=Math.hypot(px,py,pz)||1;
    const n=[px/m,py/m,pz/m];
    ripples.push({nx:n[0],ny:n[1],nz:n[2],age:0});   // a force that spreads across the surface like water
    numlit.push({x:px,y:py,z:pz,life:1});            // subtle colored light cast onto the number
    const a=Math.abs(n[2])<0.9?[0,0,1]:[0,1,0];
    let t1=cross(n,a);const tm=Math.hypot(...t1)||1;t1=[t1[0]/tm,t1[1]/tm,t1[2]/tm];
    const t2=cross(n,t1);
    const cnt=10+Math.floor(Math.random()*6);
    for(let i=0;i<cnt;i++){
      const ang=Math.random()*Math.PI*2;
      const tan=(0.6+Math.random()*1.4), out=(0.2+Math.random()*0.8);   // gentler burst
      sparks.push({x:px,y:py,z:pz,
        vx:(t1[0]*Math.cos(ang)+t2[0]*Math.sin(ang))*tan+n[0]*out,
        vy:(t1[1]*Math.cos(ang)+t2[1]*Math.sin(ang))*tan+n[1]*out,
        vz:(t1[2]*Math.cos(ang)+t2[2]*Math.sin(ang))*tan+n[2]*out,
        life:1,size:1.1+Math.random()*1.1});
    }
  }

  function buildMask(time){
    mctx.setTransform(DPR,0,0,DPR,0,0);
    mctx.globalCompositeOperation='source-over';
    mctx.clearRect(0,0,OW,OH);
    mctx.fillStyle='#fff';
    mctx.textAlign='center'; mctx.textBaseline='middle';
    mctx.font='400 '+FS+'px '+FAM;
    const n=chars.length, total=(n-1)*STAG+PD/2;
    const activity=0.8+0.2*Math.min(1,coh*1.6);   // clear width wave always; stronger under attack
    const sx=new Array(n), adv=new Array(n); let sum=0;
    for(let i=0;i<n;i++){
      const lt=((time - i*STAG)%total+total)%total;
      const bump=lt<PD ? (1-Math.cos(6.2832*lt/PD))/2 : 0;
      const wv=NARROW+(WIDE-NARROW)*bump;
      sx[i]=1+(wv-1)*activity; adv[i]=cw[i]*sx[i]; sum+=adv[i];
    }
    let x=OW/2 - sum/2;
    for(let i=0;i<n;i++){
      const cxc=x+adv[i]/2, y=OH/2;
      mctx.save(); mctx.translate(cxc,y); mctx.scale(sx[i],1); mctx.fillText(chars[i],0,0); mctx.restore();
      x+=adv[i];
    }
  }
  function drawNumber(time){
    tctx.setTransform(DPR,0,0,DPR,0,0);
    tctx.globalCompositeOperation='source-over';
    tctx.clearRect(0,0,OW,OH);
    const m=cfg.main, lit=Math.min(1,coh*1.3);
    const tg=[Math.min(255,m[0]+95),Math.min(255,m[1]+30),Math.min(255,m[2]+18)];   // brighten main itself
    const cr=Math.round(m[0]+(tg[0]-m[0])*lit), cg=Math.round(m[1]+(tg[1]-m[1])*lit), cb=Math.round(m[2]+(tg[2]-m[2])*lit);
    tctx.fillStyle='rgba('+cr+','+cg+','+cb+',1)';
    tctx.fillRect(0,0,OW,OH);
    buildMask(time);
    tctx.globalCompositeOperation='destination-in';
    tctx.drawImage(mk,0,0,OW,OH);
    tctx.globalCompositeOperation='source-atop';
    for(const k of speck){ tctx.fillStyle='rgba(0,0,0,'+k.a+')'; tctx.fillRect(k.x,k.y,k.r,k.r); }
    // impact-color light cast onto the number near recent strikes
    const im=cfg.impact.join(',');
    for(let i=numlit.length-1;i>=0;i--){
      const f=numlit[i]; f.life-=0.022;
      if(f.life<=0){ numlit.splice(i,1); continue; }
      const a=proj(f.x,f.y,f.z); if(!a) continue;
      const lx=a.x-(cx-OW/2), ly=a.y-(cy-OH/2), rad=R3*0.9;
      const g=tctx.createRadialGradient(lx,ly,0,lx,ly,rad);
      g.addColorStop(0,'rgba('+im+','+(f.life*0.95)+')');
      g.addColorStop(1,'rgba('+im+',0)');
      tctx.fillStyle=g; tctx.fillRect(0,0,OW,OH);
    }
    tctx.globalCompositeOperation='source-over';
    ctx.drawImage(txt, cx-OW/2, cy-OH/2, OW, OH);
  }

  function step(){
    t+=1;
    ctx.fillStyle=BG(); ctx.fillRect(0,0,W,H);    // full clear -> no trail

    stormTimer--;
    if(stormTimer<=0){
      stormTarget = Math.random()<0.5 ? (0.8+Math.random()*0.2) : (Math.random()*0.12);
      stormTimer = 90+Math.floor(Math.random()*150);
    }
    storm += (stormTarget-storm)*0.05;
    let rate=Math.max(0,storm-0.35)*0.28;
    while(rate>0 && attackers.length<4){ if(Math.random()<rate) attackers.push(spawn()); rate-=1; }
    load*=0.955;
    const tc=Math.min(1,load); coh += (tc-coh)*(tc>coh?0.10:0.03);

    const mc=M(), imc=IM();
    for(let i=attackers.length-1;i>=0;i--){
      const p=attackers[i];
      const d3=Math.hypot(p.x,p.y,p.z);
      if(d3<=R3){ explode(p.x,p.y,p.z); attackers.splice(i,1); continue; }
      p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;
      const a=proj(p.x,p.y,p.z); if(!a){attackers.splice(i,1);continue;}
      const depth=Math.max(0.3,Math.min(1.8,a.s));
      const r=(1.4+0.5*p.fsv)*depth;            // attack is a glowing dot
      ctx.save();
      ctx.fillStyle='rgba('+mc+',0.95)';
      ctx.shadowColor='rgba('+mc+',0.9)'; ctx.shadowBlur=7*depth;
      ctx.beginPath(); ctx.arc(a.x,a.y,r,0,6.2832); ctx.fill();
      ctx.restore();
    }

    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      s.x+=s.vx;s.y+=s.vy;s.z+=s.vz;
      s.vx*=0.955;s.vy*=0.955;s.vz*=0.955;
      s.life-=0.03;
      if(s.life<=0){sparks.splice(i,1);continue;}
      const a=proj(s.x,s.y,s.z); if(!a){sparks.splice(i,1);continue;}
      const al=Math.min(1, s.life*1.8);
      ctx.fillStyle='rgba('+mc+','+al+')';      // debris is main color
      const dep=Math.max(0.3,Math.min(1.7,a.s));
      const sz=s.size*dep;
      ctx.fillRect(a.x,a.y,sz,sz);
    }

    // (impact no longer flashes a big light — the ripple in drawShield carries the force)

    drawShield();
    drawNumber(t/60);
    raf=requestAnimationFrame(step);
  }

  let raf=0;
  resize();
  if(typeof ResizeObserver!=='undefined'){ new ResizeObserver(()=>resize()).observe(canvas); }
  window.addEventListener('resize',resize);
  // wait for layout to settle so the sphere doesn't pop big-then-small on open
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ resize(); raf=requestAnimationFrame(step); }));
  return { regen(){ phone=randPhone(); layoutPhone(); storm=1; stormTimer=170; }, canvas };
})(document.getElementById("c"), {"mode":"dark","main":[120,225,235],"impact":[215,250,255],"digitFS":15});</script></body></html>
