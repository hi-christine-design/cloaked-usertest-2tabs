<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Identity · Empty state</title>
<style>
  :root{
    --bg-base:#08080b;
    --ink:#f3f3f5;
    --ink-soft:#8a8a93;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg-base);
    font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    color:var(--ink);
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:0}
  #fg{z-index:2}
  /* (dark seat removed — no shadow around the email) */
  #lift{ display:none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="bg"></canvas>
    <div id="lift"></div>
    <canvas id="fg"></canvas>
  </div>

<script>
(()=>{
  const FONT = '-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif';
  const INK  = '#f3f3f5';   // white base text on the dark field

  // ---- identities to morph between (Cloaked-style aliases) ----
  const EMAILS = [
    'crayon@cloaked.id',
    'lt.heart@staycloaked.com',
    'amber.wren@cloaked.email',
    'dusk.harbor@relay.cloak',
    'quiet.fox@cloaked.id'
  ];

  // ---------- canvases ----------
  const bg = document.getElementById('bg'),  bx = bg.getContext('2d');
  const fg = document.getElementById('fg'),  fx = fg.getContext('2d');

  // offscreen low-res color field (cheap, naturally smooth when upscaled)
  const off = document.createElement('canvas'), ox = off.getContext('2d');
  const FIELD_SCALE = 0.34;  // orb buffer resolution (upscaled + heavily blurred)

  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = window.innerWidth; H = window.innerHeight;
    for(const c of [bg,fg]){ c.width = W*DPR; c.height = H*DPR; }
    bx.setTransform(DPR,0,0,DPR,0,0);
    fx.setTransform(DPR,0,0,DPR,0,0);
    off.width  = Math.max(2, Math.round(W*FIELD_SCALE));
    off.height = Math.max(2, Math.round(H*FIELD_SCALE));
    computeFont();
  }

  // ---------- background: glowing ORB (brightness pulse, solid edge) ----------
  // The sphere is ALWAYS full-size; what moves is BRIGHTNESS — each pulse: fast
  // APPEAR -> bright -> slow dim -> fast blackout (DISAPPEAR), then the next pulse
  // re-appears in a NEW colour. The appear is synced to the email change (see the
  // timeline). Natural, soft, desaturated vertical gradient with a SOLID circular
  // edge (hard clip — resolution-independent canvas gradients). Tiny dark pupil.
  const rgb=a=>`rgb(${Math.round(a[0])},${Math.round(a[1])},${Math.round(a[2])})`;
  const lerp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  // RADIAL warm->cool: each palette is centre (warm) / mid / edge (cool).
  // Each re-appearance steps to the NEXT one.
  // sampled from the reference: soft, earthy WARM centre -> a pale/neutral middle
  // -> COOL edge (natural, low-saturation — not neon). Each appear steps to next.
  // Saturated, mid-toned palettes (no pale/near-white) so white header/tabs/email read clearly
  const PALETTES=[
    {c:[236,176,40],  m:[196,128,52],  e:[44,98,196]},    // gold -> amber -> blue
    {c:[238,150,56],  m:[198,104,72],  e:[64,84,192]},    // peach -> terracotta -> indigo
    {c:[214,196,52],  m:[140,168,72],  e:[36,142,162]},   // chartreuse -> green -> teal
    {c:[238,162,46],  m:[200,108,58],  e:[72,76,196]},    // amber -> rust -> indigo
    {c:[228,184,52],  m:[168,150,64],  e:[80,112,194]},   // gold -> olive -> slate blue
    {c:[236,170,38],  m:[192,118,56],  e:[52,108,196]},   // warm gold -> amber -> blue
  ];
  // fine grain tile — overlaid to break gradient banding (soft "natural light")
  const noise=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128;
    const g=c.getContext('2d'), d=g.createImageData(128,128);
    for(let i=0;i<d.data.length;i+=4){ const v=128+(Math.random()*2-1)*22; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
    g.putImageData(d,0,0); return c; })();

  // colour of the warm->cool gradient at radius-fraction f (matches the stops below)
  function colorAt(pal,f){
    if(f<=0) return pal.c; if(f>=1) return pal.e;
    if(f<0.34) return lerp3(pal.c, lerp3(pal.c,pal.m,0.62), f/0.34);
    if(f<0.60) return lerp3(lerp3(pal.c,pal.m,0.62), pal.m, (f-0.34)/0.26);
    if(f<0.82) return lerp3(pal.m, lerp3(pal.m,pal.e,0.60), (f-0.60)/0.22);
    return lerp3(lerp3(pal.m,pal.e,0.60), pal.e, (f-0.82)/0.18);
  }
  const scale3=(c,s)=>[c[0]*s,c[1]*s,c[2]*s];
  // luminance profile: mild centre glow + a HARD EDGE (like a light, ~4% falloff)
  const lumAt=f=> f>=1 ? 0 : (f<0.96 ? 1-0.08*(f/0.96) : 0.92*(1-(f-0.96)/0.04));

  // TWO overlapping lights, crossfaded in ONE sampled radial gradient: the OLD light
  // (full size) WEAKENS while the NEW light GROWS from the centre outward over it.
  // p = progress within an interval (0 = new just born / old full-bright,
  // 1 = new full / old gone). No dark gap — it's continuous.
  function drawOrb(p, newPal, oldPal){
    bx.clearRect(0,0,W,H);
    bx.globalCompositeOperation='source-over';
    bx.fillStyle='#000'; bx.fillRect(0,0,W,H);
    const cx=W*0.5, cy=H*0.20;
    const zoom= 1 + 0.11*Math.sin(p*6.28319);          // ZOOM IN (p<.5) then ZOOM OUT (p>.5) — breathing scale
    const Rc  = Math.min(W,H)*0.92*zoom;               // LARGE orb — fills the screen so the glow reaches the header + nav
    const fn  = 1-Math.pow(1-p,2.4);                   // NEW light grows from centre — easeOut (punchy, not 匀速)
    const oldB= 1-smooth(p);                           // OLD light dims with EASING (smoothstep, not linear)
    const feF = Math.max(0.04, 0.16-0.12*p);           // crossfade feather: soft while growing -> hard when full
    const box=Rc*1.06, x0=cx-box, y0=cy-box, w2=2*box;
    const g=bx.createRadialGradient(cx,cy,0,cx,cy,Rc), N=30;
    for(let i=0;i<=N;i++){
      const f=i/N;
      const blend=clamp01((f-(fn-feF))/feF);           // 0 = NEW light, 1 = OLD light
      let col=lerp3(colorAt(newPal,f), scale3(colorAt(oldPal,f),oldB), blend);
      col=scale3(col, lumAt(f)*0.78);                        // centre glow + hard edge
      g.addColorStop(f, rgb(col));
    }
    bx.fillStyle=g; bx.fillRect(x0,y0,w2,w2);
    // GRAIN — soft-light noise (shifted each frame); no effect on black -> natural light
    bx.globalCompositeOperation='soft-light'; bx.globalAlpha=0.38;
    const jx=(Math.random()*noise.width)|0, jy=(Math.random()*noise.height)|0;
    for(let gx=x0-jx; gx<x0+w2; gx+=noise.width) for(let gy=y0-jy; gy<y0+w2; gy+=noise.height) bx.drawImage(noise,gx,gy);
    bx.globalAlpha=1; bx.globalCompositeOperation='source-over';
  }

  // ---------- foreground: morphing email ----------
  let fontSize=40, heroCY=0;
  function computeFont(){
    // smaller email — fit the longest identity within ~66% of width
    fx.font = `400 100px ${FONT}`;
    let maxW=0;
    for(const e of EMAILS) maxW = Math.max(maxW, fx.measureText(e).width);
    const fit = (W*0.73) / (maxW/100);
    fontSize = Math.max(14, Math.min(38, fit, W*0.066));
    heroCY   = H*0.50 - 20;                     // lower part of the (upper) orb — its cooler band
  }

  const smooth = t => t*t*(3-2*t);                       // smoothstep ease
  const clamp01= t => t<0?0:(t>1?1:t);

  // draw one glyph with a fast-blur + tint (one "layer" of the AE comp stack)
  function glyph(ch, x, blur, alpha, color, comp){
    if(!ch || ch.trim()==='' || alpha<=0.012) return;
    fx.save();
    fx.globalCompositeOperation = comp || 'source-over';
    if(blur>0.4) fx.filter = `blur(${blur.toFixed(1)}px)`;
    fx.globalAlpha = alpha>1?1:alpha;
    fx.fillStyle = color;
    fx.fillText(ch, x, heroCY);
    fx.restore();
  }

  // seeded RNG -> randomized (not L-to-R) character order, evenly spaced in time
  function mulberry32(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function startTimes(n, seed){
    const order=[...Array(n).keys()];
    const rng=mulberry32((seed*2654435761)>>>0);
    for(let i=n-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    const span=0.74, st=new Array(n);
    for(let r=0;r<n;r++) st[order[r]] = (n>1? r/(n-1):0)*span;   // r-th to animate, random slot
    return st;
  }

  // morph identity A -> B at progress p (0..1), mimicking the After Effects recipe:
  //  - each character is a cross fast-box-blur: old glyph blurs 0->100% out while
  //    the new glyph blurs 100%->0% in (both present, overlapping mid-swap);
  //  - character order is RANDOMIZED (seeded), not left-to-right;
  //  - the warm "burned" look = the SAME glyphs duplicated, tinted orange and
  //    extra-blurred (additive), so the orange takes the smeared letter shapes
  //    and is strongest where a glyph is most blurred. Neutral ink sits crisp on top.
  // Spacing reflows as an accordion (per-slot width lerp) so it's always even.
  // p=0 -> crisp A, p=1 -> crisp B (hold == drawMorph(s,s,1,seed)).
  function drawMorph(A, B, p, seed){
    fx.font=`400 ${fontSize}px ${FONT}`;
    fx.textAlign='center'; fx.textBaseline='middle';
    const ca=[...A], cb=[...B];
    const n=Math.max(ca.length, cb.length);
    const mw=c=> c ? (fx.measureText(c).width || fontSize*0.28) : 0;
    const MAXB=fontSize*0.62, dur=0.34;    // per-char blur travel + how long one char takes
    const st=startTimes(n, seed||1);

    // per-slot local progress
    const lp=new Array(n);
    for(let k=0;k<n;k++) lp[k]=clamp01((p-st[k])/dur);

    // accordion layout: each cell width follows its own progress, packed + centred
    const wid=new Array(n); let total=0;
    for(let k=0;k<n;k++){ const lw=smooth(lp[k]); wid[k]=mw(ca[k]||'')*(1-lw)+mw(cb[k]||'')*lw; total+=wid[k]; }
    const cx=new Array(n); let x=W/2-total/2;
    for(let k=0;k<n;k++){ cx[k]=x+wid[k]/2; x+=wid[k]; }

    // per-slot cross-blur state for old (a) and new (b) glyph
    const S=new Array(n);
    for(let k=0;k<n;k++){
      const a=ca[k]||'', b=cb[k]||'', same=a===b;
      if(same){ S[k]={a,b,same,aB:0,aA:1,bB:0,bA:0}; continue; }
      const t=lp[k];
      S[k]={ a, b, same,
        aB: t*MAXB,            aA: 1-smooth(t),      // old: sharp -> blurred, fading out
        bB: (1-t)*MAXB,        bA: smooth(t) };      // new: blurred -> sharp, fading in
    }

    // PASS 1 — orange "burned" duplicate layers (additive glow, like the AE
    // reference on black): the same glyphs re-drawn tinted orange with extra
    // compound blur, stacked. On the dark field these glow hot. Intensity
    // follows a heat curve that peaks at the swap and is 0 at rest.
    const DEEP='rgba(244,96,38,1)', GLOW='rgba(255,150,82,1)', HOT='rgba(255,226,194,1)';
    for(let k=0;k<n;k++){
      const s=S[k]; if(s.same) continue;
      const heat=Math.sin(lp[k]*Math.PI);            // 0 -> 1 -> 0 across the swap
      if(heat<=0.02) continue;
      // wide outer burn
      glyph(s.a, cx[k], s.aB*2.7+fontSize*0.16, heat*0.60, DEEP, 'lighter');
      glyph(s.b, cx[k], s.bB*2.7+fontSize*0.16, heat*0.60, DEEP, 'lighter');
      // main glow (letter-shaped)
      glyph(s.a, cx[k], s.aB*1.5+fontSize*0.06, heat*0.95, GLOW, 'lighter');
      glyph(s.b, cx[k], s.bB*1.5+fontSize*0.06, heat*0.95, GLOW, 'lighter');
      // hot core (kept modest so the burn stays orange, not white-hot)
      glyph(s.a, cx[k], s.aB*0.8+fontSize*0.02, heat*0.55, HOT, 'lighter');
      glyph(s.b, cx[k], s.bB*0.8+fontSize*0.02, heat*0.55, HOT, 'lighter');
    }

    // PASS 2 — neutral ink on top (color-dodge so the text lifts off the colour field)
    const INKCOMP = 'color-dodge';
    for(let k=0;k<n;k++){
      const s=S[k];
      if(s.same){ glyph(s.a, cx[k], 0, 1, INK, INKCOMP); continue; }
      glyph(s.a, cx[k], s.aB, s.aA, INK, INKCOMP);   // old blurring out
      glyph(s.b, cx[k], s.bB, s.bA, INK, INKCOMP);   // new blurring in
    }
  }

  // ---------- timeline: a continuous stream of overlapping lights ----------
  // Every INTERVAL a NEW light is born and grows from the centre while the previous
  // one weakens behind it (no gap). The email morphs to a new identity each time a
  // new light is born.
  const INTERVAL=3000, MORPH=1300;
  const NP=PALETTES.length;
  let lastK=-1;
  let emailIdx=0, mFrom=EMAILS[0], mTo=EMAILS[0], mActive=false, mT0=0;

  function frame(now){
    const gp=now/INTERVAL, k=Math.floor(gp), p=gp-k;
    if(k!==lastK){                                     // a new light was born
      if(lastK>=0){ emailIdx=(emailIdx+1)%EMAILS.length; mFrom=mTo; mTo=EMAILS[emailIdx]; mActive=true; mT0=now; }
      lastK=k;
    }
    drawOrb(p, PALETTES[((k%NP)+NP)%NP], PALETTES[(((k-1)%NP)+NP)%NP]);

    fx.clearRect(0,0,W,H);
    if(mActive){ const pp=clamp01((now-mT0)/MORPH); drawMorph(mFrom, mTo, pp, k+1); if(pp>=1) mActive=false; }
    else drawMorph(mTo, mTo, 1, k+1);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
  // debug hook: __orbPhase(p, newPalIdx) freezes the overlap at interval phase p (0..1)
  window.__orbPhase=(p,pi=1,em=0)=>{ window.requestAnimationFrame=()=>0;
    drawOrb(p, PALETTES[((pi%NP)+NP)%NP], PALETTES[(((pi-1)%NP)+NP)%NP]);
    fx.clearRect(0,0,W,H); drawMorph(EMAILS[em%EMAILS.length], EMAILS[em%EMAILS.length], 1, pi+1); };
})();
</script>
</body>
</html>
