<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Satellites — line field</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:fixed;inset:0;background:#000}
  canvas{position:absolute;inset:0;width:100vw;height:100vh;display:block}
  #lines{z-index:0}
  #fg{z-index:2}
  #lift{position:absolute;z-index:1;left:50%;top:50%;width:64vw;height:15vh;
        transform:translate(-50%,-50%);pointer-events:none;
        background:radial-gradient(ellipse at center,rgba(0,0,0,.6) 0%,rgba(0,0,0,.34) 46%,rgba(0,0,0,0) 76%)}
  #ui{position:fixed;left:16px;bottom:16px;z-index:5;font:11px/1.5 -apple-system,system-ui,sans-serif;
      color:#666;user-select:none;letter-spacing:.04em}
  #ui b{color:#aaa;font-weight:500}
  #ui .row{margin-top:6px;display:flex;align-items:center;gap:8px}
  #ui input[type=range]{width:120px;accent-color:#fff;height:2px}
  #ui kbd{color:#888;border:1px solid #333;border-radius:3px;padding:1px 5px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="lines"></canvas>
  <div id="lift"></div>
  <canvas id="fg"></canvas>
</div>
<div id="ui">
  <b>SATELLITES</b> &nbsp;·&nbsp; <span id="hint">press <kbd>H</kbd> for controls</span>
  <div id="panel" style="display:none">
    <div class="row"><span style="width:60px">tilt</span><input id="s_tilt" type="range" min="0.18" max="1" step="0.01"></div>
    <div class="row"><span style="width:60px">density</span><input id="s_dens" type="range" min="18" max="60" step="1"></div>
    <div class="row"><span style="width:60px">spin</span><input id="s_speed" type="range" min="0" max="2.5" step="0.01"></div>
    <div class="row"><span style="width:60px">length</span><input id="s_len" type="range" min="5" max="36" step="1"></div>
    <div class="row"><span style="width:60px">swirl</span><input id="s_swirl" type="range" min="-1" max="1" step="0.01"></div>
    <div class="row"><span style="width:60px">ripple</span><input id="s_ripple" type="range" min="0" max="2" step="0.01"></div>
  </div>
</div>
<script>
(function(){
"use strict";
var FONT='-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif';
var INK='#f3f3f5';

var EMAILS=[
  'crayon@cloaked.id',
  'lt.heart@staycloaked.com',
  'amber.wren@cloaked.email',
  'dusk.harbor@relay.cloak',
  'quiet.fox@cloaked.id'
];

// per-identity palette for the LINES: warm centre -> cool edge.
// more saturated / hue-diverse so each email change reads as a strong colour shift.
var PALETTES=[
  {c:[245,200,90],  m:[205,170,135], e:[70,130,225]},   // gold -> blue
  {c:[245,120,90],  m:[205,150,150], e:[70,205,190]},   // coral -> teal
  {c:[150,230,110], m:[175,200,150], e:[210,90,200]},   // green -> magenta
  {c:[245,170,70],  m:[205,160,150], e:[90,90,225]},    // amber -> indigo
  {c:[245,110,170], m:[210,160,185], e:[80,210,235]},   // pink -> cyan
  {c:[180,110,240], m:[185,170,195], e:[175,230,90]}    // violet -> lime
];

// vivid colours for the single "rogue" line that stands out each change
var ACCENTS=[[255,70,130],[120,235,255],[170,255,110],[255,170,60],[235,110,255],[255,240,120]];

var P={tilt:0.60, spacing:30, speed:0.5, len:11, width:1.0, swirl:0.35, ringGap:30,
       ripple:1.0, rippleSpeed:780, rippleWidth:150};

var linesC=document.getElementById('lines'), lx=linesC.getContext('2d');
var fg=document.getElementById('fg'), fx=fg.getContext('2d');
var W,H,cx,cy,DPR,maxR;

function clamp01(t){return t<0?0:(t>1?1:t);}
function smooth(t){return t*t*(3-2*t);}
function lerp3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  linesC.width=W*DPR; linesC.height=H*DPR;
  fg.width=W*DPR; fg.height=H*DPR;
  lx.setTransform(DPR,0,0,DPR,0,0);
  fx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2; cy=H/2;
  maxR=Math.hypot(W,H)/2/Math.max(P.tilt,0.18)+P.ringGap;
  computeFont();
}

/* ---------- timeline: email morph drives colour + ripple ---------- */
var PULSE=4000, MORPH=1500;
var pulseStart=performance.now();
var palFromIdx=0, palToIdx=0, colorT0=-1e9;
var ripples=[];
var emailIdx=0, mFrom=EMAILS[0], mTo=EMAILS[0], mActive=false, mT0=0;
// the "rogue" dots that ride on a few lines this cycle — kept near the centre
var ACCENT_N=7, ACCENT_INNER=9, DOT=6;   // count, how close to centre, dot diameter (px)
function makeAccent(ring,frac,col){
  // each dot hops 1–2 times per 5s window, at its own random offset/times
  var nj=1+(Math.random()<0.5?0:1), jt=[];
  for(var j=0;j<nj;j++) jt.push(500+Math.random()*3800);
  return {ring:ring, frac:frac, col:col, j0:Math.random()*5000, jt:jt};
}
var accents=[makeAccent(3,0.2,ACCENTS[0]),makeAccent(5,0.6,ACCENTS[1]),makeAccent(4,0.85,ACCENTS[2])];

function appear(now){
  emailIdx=(emailIdx+1)%EMAILS.length;
  mFrom=mTo; mTo=EMAILS[emailIdx]; mActive=true; mT0=now;
  palFromIdx=palToIdx; palToIdx=(palToIdx+1)%PALETTES.length; colorT0=now;
  ripples.push({t0:now});
  if(ripples.length>4) ripples.shift();
  // pick fresh rogue dots + vivid colours each change, biased toward the centre
  var nRings=Math.max(8, Math.floor((maxR-P.ringGap)/P.ringGap));
  var innerMax=Math.min(ACCENT_INNER, nRings-1);
  accents=[];
  for(var ai=0;ai<ACCENT_N;ai++){
    accents.push(makeAccent(
      2+Math.floor(Math.random()*Math.max(1,innerMax-1)),
      Math.random(),
      ACCENTS[Math.floor(Math.random()*ACCENTS.length)]
    ));
  }
}

function paletteAt(now){
  var t=smooth(clamp01((now-colorT0)/MORPH));
  var A=PALETTES[palFromIdx], B=PALETTES[palToIdx];
  return {c:lerp3(A.c,B.c,t), m:lerp3(A.m,B.m,t), e:lerp3(A.e,B.e,t)};
}
function colorForRadius(pal,rn){
  return rn<0.5 ? lerp3(pal.c,pal.m,rn*2) : lerp3(pal.m,pal.e,(rn-0.5)*2);
}
// length ripple radiating from centre: shrink then swell as the front passes
function rippleLenFactor(r,now){
  var f=0;
  for(var i=0;i<ripples.length;i++){
    var elapsed=(now-ripples[i].t0)/1000;
    var d=elapsed*P.rippleSpeed - r;
    var e=Math.exp(-Math.pow(d/(P.rippleWidth*1.4),2));
    if(e<0.01) continue;
    f += Math.sin((d/P.rippleWidth)*Math.PI)*e*Math.exp(-elapsed*0.5);
  }
  return f;
}
// natural hop for one dot: a quick gravity arc with a tiny landing settle (0..1)
function hop(now,acc){
  var period=5000, ph=(now-acc.j0)%period; if(ph<0) ph+=period;
  var h=0, w=560;
  for(var c=0;c<acc.jt.length;c++){
    var dt=ph-acc.jt[c];
    if(dt>=0&&dt<w){
      var u=dt/w;                          // 0..1 through the hop
      // ease-out rise + gravity fall, then a small damped settle
      var arc=Math.sin(u*Math.PI);         // smooth up/down
      var settle=Math.sin(u*Math.PI*3)*Math.exp(-u*4)*0.12; // subtle bounce on landing
      h=Math.max(h, arc+settle);
    }
  }
  return h<0?0:h;
}

/* ---------- line field ---------- */
function drawLines(now){
  // spin is driven by REAL elapsed time (not frame count) so it never stalls
  // when the email morph's blur filters briefly drop the frame rate.
  var T=now*0.001;
  lx.clearRect(0,0,W,H);
  lx.fillStyle='#000'; lx.fillRect(0,0,W,H);
  var tilt=P.tilt, pal=paletteAt(now);
  // brightness flash at the moment of the colour change -> stronger perceived shift
  var flash=Math.exp(-(now-colorT0)/650);
  // exclusion box around the email text so no rogue line is highlighted on top of it
  fx.font='400 '+fontSize+'px '+FONT;
  var exHalfW=Math.max(fx.measureText(mFrom).width, fx.measureText(mTo).width)/2+16;
  var exHalfH=fontSize*0.95+14;
  lx.lineCap='round'; lx.lineWidth=P.width;
  var ring=0;
  for(var r=P.ringGap; r<maxR; r+=P.ringGap, ring++){
    var count=Math.max(6, Math.round((2*Math.PI*r)/P.spacing));
    var speed=P.speed*0.18*(1+P.swirl*ring*0.12);
    var phase=T*speed+ring*0.20;
    var rn=Math.min(1,r/maxR);
    var col=colorForRadius(pal,rn);
    var ripF=rippleLenFactor(r,now);
    // which tick indices on THIS ring carry a rogue dot (-> the whole accent obj)
    var accMap=null;
    for(var ax=0;ax<accents.length;ax++){
      if(accents[ax].ring===ring){
        if(!accMap) accMap={};
        accMap[Math.round(accents[ax].frac*count)%count]=accents[ax];
      }
    }
    for(var i=0;i<count;i++){
      var a=(i/count)*Math.PI*2+phase;
      var x=cx+Math.cos(a)*r;
      var y=cy+Math.sin(a)*r*tilt;
      var depth=(Math.sin(a)+1)/2;
      var shimmer=(Math.sin(a*2-T*1.2+r*0.02)+1)/2;
      var len=Math.max(1, P.len*(0.82+shimmer*0.22)*(1+P.ripple*0.9*ripF));
      var ac=accMap&&accMap[i];
      if(ac){
        var h=hop(now, ac);                        // 0..1 natural hop
        var top=y-len/2;                           // top end of the line
        var dotY=top - h*22;                       // dot caps the top, lifts off on the hop
        var c0=ac.col;
        // skip the dot if it would land on the email text; else draw a normal line + dot
        if(!(Math.abs(x-cx)<exHalfW && Math.abs(dotY-cy)<exHalfH)){
          // the underlying line stays normal width, tinted in the dot's colour
          lx.lineWidth=P.width;
          lx.strokeStyle='rgba('+c0[0]+','+c0[1]+','+c0[2]+',0.55)';
          lx.beginPath();
          lx.moveTo(x,top);
          lx.lineTo(x,y+len/2);
          lx.stroke();
          // the 6px round dot at the TOP end of the line (grows a touch at the apex)
          var dr=DOT/2 + h*1.6;
          lx.fillStyle='rgba('+c0[0]+','+c0[1]+','+c0[2]+',1)';
          lx.beginPath();
          lx.arc(x, dotY, dr, 0, Math.PI*2);
          lx.fill();
          continue;
        }
      }
      var bright=0.66+depth*0.38+shimmer*0.16+Math.max(0,ripF)*0.35*P.ripple+flash*0.5;
      var alpha=Math.min(1, 0.55+depth*0.38+Math.max(0,ripF)*0.5*P.ripple+flash*0.3);
      var k=Math.min(1.5,bright);
      lx.strokeStyle='rgba('+((col[0]*k)|0)+','+((col[1]*k)|0)+','+((col[2]*k)|0)+','+alpha.toFixed(3)+')';
      lx.beginPath();
      lx.moveTo(x,y-len/2);
      lx.lineTo(x,y+len/2);
      lx.stroke();
    }
  }
}

/* ---------- morphing email (from identity-empty-state.html) ---------- */
var fontSize=30, heroCY=0;
function computeFont(){
  fx.font='400 100px '+FONT;
  var maxW=0; for(var i=0;i<EMAILS.length;i++) maxW=Math.max(maxW, fx.measureText(EMAILS[i]).width);
  var fit=(W*0.82)/(maxW/100);
  fontSize=Math.max(14, Math.min(46, fit, W*0.078));
  heroCY=H*0.5;
}
function glyph(ch,x,blur,alpha,color,comp){
  if(!ch||ch.trim()===''||alpha<=0.012) return;
  fx.save();
  fx.globalCompositeOperation=comp||'source-over';
  if(blur>0.4) fx.filter='blur('+blur.toFixed(1)+'px)';
  fx.globalAlpha=alpha>1?1:alpha;
  fx.fillStyle=color;
  fx.fillText(ch,x,heroCY);
  fx.restore();
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function startTimes(n,seed){
  var order=[]; for(var i=0;i<n;i++) order.push(i);
  var rng=mulberry32((seed*2654435761)>>>0);
  for(var j=n-1;j>0;j--){var q=Math.floor(rng()*(j+1));var tmp=order[j];order[j]=order[q];order[q]=tmp;}
  var span=0.74, st=new Array(n);
  for(var r=0;r<n;r++) st[order[r]]=(n>1?r/(n-1):0)*span;
  return st;
}
function drawMorph(A,B,p,seed){
  fx.font='400 '+fontSize+'px '+FONT;
  fx.textAlign='center'; fx.textBaseline='middle';
  var ca=A.split(''), cb=B.split('');
  var n=Math.max(ca.length,cb.length);
  var mw=function(c){return c?(fx.measureText(c).width||fontSize*0.28):0;};
  var MAXB=fontSize*0.62, dur=0.34;
  var st=startTimes(n,seed||1);
  var lp=new Array(n);
  for(var k=0;k<n;k++) lp[k]=clamp01((p-st[k])/dur);
  var wid=new Array(n), total=0;
  for(k=0;k<n;k++){var lw=smooth(lp[k]); wid[k]=mw(ca[k]||'')*(1-lw)+mw(cb[k]||'')*lw; total+=wid[k];}
  var gx=new Array(n), x=W/2-total/2;
  for(k=0;k<n;k++){gx[k]=x+wid[k]/2; x+=wid[k];}
  var S=new Array(n);
  for(k=0;k<n;k++){
    var aa=ca[k]||'', bb=cb[k]||'', same=aa===bb;
    if(same){S[k]={a:aa,b:bb,same:true,aB:0,aA:1,bB:0,bA:0}; continue;}
    var tt=lp[k];
    S[k]={a:aa,b:bb,same:false, aB:tt*MAXB, aA:1-smooth(tt), bB:(1-tt)*MAXB, bA:smooth(tt)};
  }
  var DEEP='rgba(244,96,38,1)', GLOW='rgba(255,150,82,1)', HOT='rgba(255,226,194,1)';
  for(k=0;k<n;k++){
    var s=S[k]; if(s.same) continue;
    var heat=Math.sin(lp[k]*Math.PI); if(heat<=0.02) continue;
    glyph(s.a,gx[k],s.aB*2.7+fontSize*0.16,heat*0.60,DEEP,'lighter');
    glyph(s.b,gx[k],s.bB*2.7+fontSize*0.16,heat*0.60,DEEP,'lighter');
    glyph(s.a,gx[k],s.aB*1.5+fontSize*0.06,heat*0.95,GLOW,'lighter');
    glyph(s.b,gx[k],s.bB*1.5+fontSize*0.06,heat*0.95,GLOW,'lighter');
    glyph(s.a,gx[k],s.aB*0.8+fontSize*0.02,heat*0.55,HOT,'lighter');
    glyph(s.b,gx[k],s.bB*0.8+fontSize*0.02,heat*0.55,HOT,'lighter');
  }
  for(k=0;k<n;k++){
    var s2=S[k];
    if(s2.same){glyph(s2.a,gx[k],0,1,INK); continue;}
    glyph(s2.a,gx[k],s2.aB,s2.aA,INK);
    glyph(s2.b,gx[k],s2.bB,s2.bA,INK);
  }
}

/* ---------- main loop ---------- */
function frame(now){
  if(now-pulseStart>=PULSE){ pulseStart=now; appear(now); }
  drawLines(now);
  fx.clearRect(0,0,W,H);
  if(mActive){ var p=clamp01((now-mT0)/MORPH); drawMorph(mFrom,mTo,p,emailIdx+1); if(p>=1) mActive=false; }
  else drawMorph(mTo,mTo,1,emailIdx+1);
  requestAnimationFrame(frame);
}

window.addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);

/* ---------- controls ---------- */
var panel=document.getElementById('panel'), hint=document.getElementById('hint');
window.addEventListener('keydown',function(e){
  if(e.key.toLowerCase()==='h'){
    var on=panel.style.display==='none';
    panel.style.display=on?'block':'none';
    hint.style.display=on?'none':'inline';
  }
});
function bind(id,key,after){var el=document.getElementById(id); el.value=P[key];
  el.addEventListener('input',function(){P[key]=parseFloat(el.value); if(after) after();});}
bind('s_tilt','tilt',resize);
bind('s_dens','spacing');
bind('s_speed','speed');
bind('s_len','len');
bind('s_swirl','swirl');
bind('s_ripple','ripple');
})();
</script>
</body>
</html>
