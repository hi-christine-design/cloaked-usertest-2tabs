<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloaked Scanning Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  /* ---- design tokens (from Figma) ---- */
  :root{
    --bg-page:#F3F1ED;            /* same as the left panel — seamless backdrop */
    --text-primary:#141410;       /* Global/Text/Primary (light surface) */
    --text-secondary:#84827e;     /* Global/Text/Secondary */
    --text-on-dark:#f3f1ed;       /* Global/Text/Primary (dark card) */
    --divider:#0b0b0a26;          /* Divider/Divider = rgba(11,11,10,.15) */
    --btn-primary:#0b0b0a;        /* Button/Primary/Container */
    --btn-primary-text:#ffffff;   /* Button/Primary/Text */
    --radius-2:2px;               /* Spacing/2 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--bg-page);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
    color:var(--text-primary);-webkit-font-smoothing:antialiased;}
  #app{display:flex;justify-content:center;padding:40px 40px 40px 328px;min-height:100vh;}

  /* ============ LEFT PANEL — flat editorial sidebar ============ */
  #panel{position:fixed;top:0;left:0;height:100vh;width:288px;z-index:10;box-sizing:border-box;
    background:#F3F1ED;border-right:1px solid #DCD8CF;padding:32px 24px;
    display:flex;flex-direction:column;justify-content:space-between;gap:32px;overflow-y:auto;
    user-select:none;color:#141410;font-size:13px;
    font-family:"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;}
  #panel::-webkit-scrollbar{width:6px;}
  #panel::-webkit-scrollbar-thumb{background:#DCD8CF;border-radius:3px;}
  .controls,.save-area{display:flex;flex-direction:column;gap:24px;}
  .group{display:flex;flex-direction:column;gap:10px;}
  .group-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8B8980;}

  /* segmented pills (Size, Export) */
  .seg{display:flex;gap:4px;}
  .btn{flex:1;background:transparent;color:#8B8980;border:1px solid #DCD8CF;border-radius:2px;
    padding:7px 8px;font:inherit;font-size:11px;cursor:pointer;text-align:center;white-space:nowrap;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    transition:background .14s ease,color .14s ease,border-color .14s ease;}
  .btn:hover{color:#141410;border-color:#141410;}
  .btn.active{background:#141410;color:#F3F1ED;border-color:#141410;}
  .btn .ico{width:13px;height:13px;flex:none;}
  .btn:disabled{opacity:.55;cursor:default;}

  /* show-ui toggle (small, palette-matched) */
  .toggle{width:40px;height:22px;border-radius:100px;background:#141410;padding:3px;cursor:pointer;
    flex:none;transition:background .18s ease;}
  .toggle:not(.on){background:#CFCBC1;}
  .toggle .knob{width:16px;height:16px;border-radius:50%;background:#F3F1ED;transition:transform .18s ease;}
  .toggle.on .knob{transform:translateX(18px);}

  /* event-found stepper */
  .stepper{display:flex;align-items:center;gap:8px;}
  .step{width:26px;height:26px;border-radius:2px;border:1px solid #DCD8CF;background:transparent;
    color:#141410;font:inherit;font-size:15px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:border-color .14s ease,color .14s ease;}
  .step:hover{border-color:#141410;}
  .evnum{flex:1;min-width:0;border:none;background:transparent;outline:none;text-align:center;
    font:inherit;font-size:15px;color:#141410;font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
  .evnum::-webkit-outer-spin-button,.evnum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  /* ============ RIGHT STAGE ============ */
  #stageWrap{flex:1;display:flex;align-items:center;justify-content:center;}
  /* card authored at 400% (692x800); CSS-scaled down for 100/200/300% */
  #card{position:relative;width:692px;height:800px;border-radius:80px;overflow:hidden;
    background:#1b1b18;transform-origin:center center;
    transition:transform .25s ease;}
  #card canvas{display:block;position:absolute;inset:0;z-index:2;}

  /* orange alert — soft radial bloom from the radar centre; fades to transparent (no rect edge) */
  #alert{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transform:scale(.4);
    transform-origin:50% 50%;
    background:radial-gradient(circle closest-side at 50% 50%,
      #F2A24E 0%,#E2812F 40%,#C9551B 72%,rgba(176,70,22,.45) 88%,rgba(120,48,26,0) 100%);}
  /* one smooth continuous growth to full bleed; opacity fades independently so the scale never stalls */
  #alert.pulse{animation:
    alertGrow 3.2s cubic-bezier(.16,.7,.3,1) forwards,
    alertFade 3.2s linear forwards;}
  @keyframes alertGrow{ from{transform:scale(.3);} to{transform:scale(2.6);} }
  @keyframes alertFade{ 0%{opacity:0;} 12%{opacity:1;} 72%{opacity:1;} 100%{opacity:0;} }

  /* text overlay — exact Figma positions at 400% */
  #overlay{position:absolute;inset:0;z-index:3;pointer-events:none;color:var(--text-on-dark);}
  #overlay.hidden{display:none;}
  #title{position:absolute;left:64px;top:64px;width:564px;
    font:500 64px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;letter-spacing:-1.28px;font-synthesis:none;}
  /* number + unit share a real text baseline so their bottoms line up; nudged up 8px */
  #count{position:absolute;left:64px;top:184px;width:452px;display:flex;align-items:baseline;gap:16px;}
  #num{position:relative;display:inline-block;
    font:400 192px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
    letter-spacing:-3.84px;font-variant-numeric:tabular-nums;}
  #num .ghost{visibility:hidden;}                       /* sets width + baseline, invisible */
  #num .roll{position:absolute;left:0;top:0;white-space:nowrap;}
  #num .dcol{display:inline-block;vertical-align:top;height:1em;overflow:hidden;}
  #num .dstrip{display:flex;flex-direction:column;transition:transform .9s cubic-bezier(.2,.75,.25,1);}
  #num .dstrip > i{display:block;height:1em;line-height:1;font-style:normal;}
  #unit{font:400 64px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;letter-spacing:-1.28px;}
  #tag{position:absolute;left:64px;top:632px;width:564px;height:103px;display:flex;
    align-items:center;justify-content:center;gap:16px;background:#232321;
    border-radius:96px;transition:background .3s ease;}
  /* event-found state — Figma tag-status/small (856:1762): solid #b83100, white dot */
  #tag.alert{background:#b83100;}
  #tag.alert .dot{background:#fff;}
  #tag .dot{width:24px;height:24px;border-radius:50%;background:#37c64a;transition:background .25s;
    animation:dotBlink 1.6s ease-in-out infinite;}
  @keyframes dotBlink{0%,100%{opacity:1;}50%{opacity:.45;}}
  #tag .tagtext{font:400 56px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;letter-spacing:-1.12px;color:#fff;}
</style>
</head>
<body>
<div id="app">
  <!-- ============ LEFT PANEL ============ -->
  <div id="panel">
    <div class="controls">
      <section class="group">
        <span class="group-label">Show UI</span>
        <div id="toggle" class="toggle on"><div class="knob"></div></div>
      </section>

      <section class="group">
        <span class="group-label">Size</span>
        <div class="seg">
          <button class="btn size active" data-size="100">100%</button>
          <button class="btn size" data-size="200">200%</button>
          <button class="btn size" data-size="300">300%</button>
        </div>
      </section>

      <section class="group">
        <span class="group-label">Event Found</span>
        <div class="stepper">
          <button class="step" id="evMinus" aria-label="decrease">&#8722;</button>
          <input id="evInput" class="evnum" type="text" inputmode="numeric" value="0" />
          <button class="step" id="evPlus" aria-label="increase">+</button>
        </div>
      </section>
    </div>

    <div class="save-area">
      <section class="group">
        <span class="group-label">Export</span>
        <div class="seg">
          <button class="btn" id="exportMp4"><span class="t">MP4</span>
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
          </button>
          <button class="btn" id="exportHtml"><span class="t">HTML</span>
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
          </button>
        </div>
      </section>
    </div>
  </div>

  <!-- ============ RIGHT STAGE ============ -->
  <div id="stageWrap">
    <div id="card">
      <div id="alert"></div>
      <div id="overlay">
        <div id="title">SSN monitoring</div>
        <div id="count"><span id="num">0</span><span id="unit">events</span></div>
        <div id="tag"><span class="dot"></span><span class="tagtext">Active</span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ===================== Cloaked Scanning Card =====================
const W = 692, H = 800;            // authored at 400%; CSS scales down for 100/200%
const CARD_RADIUS = 80;
const SCAN_BG  = [27, 27, 24];     // #1b1b18 (orange alert is a DOM overlay, see #alert)

const center = { x: W / 2, y: H / 2 };
const maxR = 560;                  // covers the rounded-rect corners from center

const LOOP = 16, RING_CYCLES = 2;  // seamless-loop timing

const state = { showUI:true, size:100, events:0 };

let layer, maskGfx, cnv, recording = false, t = 0;

// ── radar blips: one orange dot per detected event, revealed as the sweep passes ──
const GOLDEN = Math.PI * (3 - Math.sqrt(5));        // even angular spread
const BLIP = { rMin:140, rMax:330, dotR:12, color:[255,85,12], emerge:0.55, delay:1.9 };  // #FF550C
let blips = [], prevLead = null;
function makeBlip(i){
  const a = (i * GOLDEN) % (Math.PI * 2);
  const r = BLIP.rMin + (((i * 0.6180339887) % 1)) * (BLIP.rMax - BLIP.rMin);
  return { ang:(a + Math.PI * 2) % (Math.PI * 2), r, lit:false, litT:0 };
}
function syncBlips(n){
  n = Math.max(0, n | 0);
  let added = 0;
  while (blips.length < n){
    const b = makeBlip(blips.length);
    b.lit = true; b.litT = t + BLIP.delay + added * 0.15;   // emerge AFTER the bloom fills the space (staggered)
    blips.push(b); added++;
  }
  while (blips.length > n) blips.pop();
}

function setup() {
  cnv = createCanvas(W, H);
  cnv.parent('card');
  pixelDensity(2);
  layer = createGraphics(W, H);
  maskGfx = createGraphics(W, H);
  maskGfx.noStroke(); maskGfx.fill(255);
  maskGfx.rect(0, 0, W, H, CARD_RADIUS);
}

function drawScan(g) {
  g.push();
  // expanding radar rings (subtle, ~40% feel from the design)
  const period = LOOP / RING_CYCLES, ringCount = 7;
  for (let k = 0; k < ringCount; k++) {
    let phase = ((t / period) + k / ringCount) % 1;
    const rr = (1 - Math.pow(1 - phase, 1.8)) * maxR;
    g.noFill();
    g.stroke(255, 255, 255, (1 - phase) * 70);
    g.strokeWeight(1.5);
    g.ellipse(center.x, center.y, rr * 2, rr * 2);
  }
  // rotating sweep wedge
  const speed = TWO_PI / LOOP, sweepR = maxR;
  const ang = t * speed + HALF_PI, span = 1.7, steps = 140;
  g.noStroke();
  for (let j = 0; j < steps; j++) {
    const f0 = j / steps, f1 = (j + 1) / steps;
    const a0 = ang - Math.pow(f0, 1.25) * span;
    const a1 = ang - Math.pow(f1, 1.25) * span;
    g.fill(255, 255, 255, Math.pow(1 - f0, 1.8) * 120);
    g.beginShape();
    g.vertex(center.x, center.y);
    g.vertex(center.x + cos(a0) * sweepR, center.y + sin(a0) * sweepR);
    g.vertex(center.x + cos(a1) * sweepR, center.y + sin(a1) * sweepR);
    g.endShape(CLOSE);
  }
  g.stroke(255, 255, 255, 170);
  g.strokeWeight(1.8);
  g.line(center.x, center.y, center.x + cos(ang) * sweepR, center.y + sin(ang) * sweepR);

  // ── blips: each detected event emerges as an orange dot (synced with the alert bloom), then persists ──
  const lead = ((ang % TWO_PI) + TWO_PI) % TWO_PI;
  g.noStroke();
  for (const b of blips){
    if (!b.lit || t < b.litT) continue;               // not emerged yet
    const bx = center.x + cos(b.ang) * b.r;
    const by = center.y + sin(b.ang) * b.r;
    const k  = Math.min(1, Math.max(0, (t - b.litT) / BLIP.emerge));
    const sc = 1 - Math.pow(1 - k, 3);                 // easeOutCubic bloom (scale + fade in)
    let d = Math.abs((((lead - b.ang + Math.PI) % TWO_PI) + TWO_PI) % TWO_PI - Math.PI);
    const shimmer = Math.max(0, 1 - d / 0.5);          // brief flare as the line passes over
    const R = BLIP.dotR * (0.96 + 0.10 * shimmer) * sc;
    const [cr, cg, cb] = BLIP.color;
    g.fill(cr, cg, cb, 255 * sc); g.ellipse(bx, by, R * 2.0, R * 2.0);   // flat dot, no glow
  }
  g.pop();
}

function draw() {
  t += deltaTime / 1000;
  layer.clear();                       // transparent — the dark card bg + orange #alert show through
  drawScan(layer);
  layer.drawingContext.globalCompositeOperation = 'destination-in';
  layer.drawingContext.drawImage(maskGfx.elt, 0, 0, W, H);
  layer.drawingContext.globalCompositeOperation = 'source-over';
  if (recording) background(SCAN_BG[0], SCAN_BG[1], SCAN_BG[2]); else clear();
  image(layer, 0, 0);
}

// ===================== UI wiring =====================
const card = document.getElementById('card');
const overlay = document.getElementById('overlay');
const numEl = document.getElementById('num');
const evInput = document.getElementById('evInput');
const alertEl = document.getElementById('alert');
const tagText = document.querySelector('#tag .tagtext');
let rollTimer = null;

// label reflects state: any events found → "Event found" (dot keeps blinking = still active)
function updateTag(n){
  const found = n > 0;
  if (tagText) tagText.textContent = found ? 'Event found' : 'Active';
  document.getElementById('tag').classList.toggle('alert', found);   // red #b83100 + white dot when found
}

// bloom the orange gradient in, then let it fade out (restart on every new event)
function triggerAlert(){
  alertEl.classList.remove('pulse');
  void alertEl.offsetWidth;            // force reflow so the animation re-runs
  alertEl.classList.add('pulse');
}

// ---- rolling-digit odometer for the events number ----
// #num = a hidden "ghost" (real text → correct width + baseline) with the rolling
// digit columns absolutely overlaid on top, so layout/alignment stay perfect.
numEl.textContent = '';
const ghostEl = document.createElement('span'); ghostEl.className = 'ghost';
const rollEl  = document.createElement('span'); rollEl.className  = 'roll';
numEl.appendChild(ghostEl);
numEl.appendChild(rollEl);
let cols = [];          // cols[0] = ones place, cols[1] = tens, … (stable per place value)
let shownValue = 0;
// strip holds 0-9 twice so a 9→0 carry rolls UP one step (to the duplicate 0 at index d+10),
// then silently snaps back — no scrolling back through 8,7,6,…
function makeColumn(){
  const strip = document.createElement('span');
  strip.className = 'dstrip';
  for (let r = 0; r < 20; r++){ const c = document.createElement('i'); c.textContent = r % 10; strip.appendChild(c); }
  const col = document.createElement('span');
  col.className = 'dcol';
  col.appendChild(strip);
  const obj = { col, strip, cur: 0, wrapTo: null };
  strip.addEventListener('transitionend', () => {
    if (obj.wrapTo != null){
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(-' + obj.wrapTo + 'em)';
      void strip.offsetHeight;                        // commit the snap with no animation
      strip.style.transition = '';
      obj.cur = obj.wrapTo;
      obj.wrapTo = null;
    }
  });
  return obj;
}
function setDigit(obj, d, instant){
  if (instant){
    obj.strip.style.transition = 'none';
    obj.strip.style.transform = 'translateY(-' + d + 'em)';
    void obj.strip.offsetHeight;
    obj.strip.style.transition = '';
    obj.cur = d; obj.wrapTo = null;
    return;
  }
  if (obj.wrapTo != null){                            // settle any in-flight wrap first
    obj.strip.style.transition = 'none';
    obj.strip.style.transform = 'translateY(-' + obj.wrapTo + 'em)';
    void obj.strip.offsetHeight;
    obj.strip.style.transition = '';
    obj.cur = obj.wrapTo; obj.wrapTo = null;
  }
  if (d === obj.cur) return;
  if (d > obj.cur){                                   // roll up to the digit
    obj.strip.style.transform = 'translateY(-' + d + 'em)';
    obj.cur = d;
  } else {                                            // carry (e.g. 9→0): roll up one step, then snap
    obj.wrapTo = d;
    obj.strip.style.transform = 'translateY(-' + (d + 10) + 'em)';
  }
}
function renderNumber(n){
  n = Math.max(0, n | 0);
  const str = String(n);
  const need = str.length;
  const instant = n < shownValue;                     // increments roll; decrements snap (no reverse scroll)
  ghostEl.textContent = str;                          // drives width + baseline
  while (cols.length < need){                         // new higher place → add on the LEFT, ones stays put
    const c = makeColumn();
    rollEl.insertBefore(c.col, rollEl.firstChild);
    cols.push(c);
  }
  while (cols.length > need){ cols.pop().col.remove(); }
  void rollEl.offsetHeight;                           // reflow so freshly-added columns animate from 0
  for (let i = 0; i < need; i++){
    setDigit(cols[i], +str[need - 1 - i], instant);   // i = 0 → ones
  }
  shownValue = n;
}

function applySize(){ card.style.transform = 'scale(' + (state.size/400) + ')'; }
function setSize(size){
  state.size = size;
  document.querySelectorAll('.btn.size').forEach(b => b.classList.toggle('active', +b.dataset.size===size));
  applySize();
}
function setShowUI(on){
  state.showUI = on;
  document.getElementById('toggle').classList.toggle('on', on);
  overlay.classList.toggle('hidden', !on);
}
// authoritative setter (stepper / init): clamps to >= 0, flashes on an increase
function setEvents(n){
  n = Math.max(0, Math.floor(Number(n) || 0));
  const up = n > state.events;
  state.events = n;
  evInput.value = n;
  syncBlips(n); updateTag(n);
  clearTimeout(rollTimer);
  if (up){ triggerAlert(); rollTimer = setTimeout(() => renderNumber(n), 1300); }  // number rolls up at the bloom peak
  else renderNumber(n);
}

document.getElementById('toggle').addEventListener('click', () => setShowUI(!state.showUI));
document.querySelectorAll('.btn.size').forEach(b => b.addEventListener('click', () => setSize(+b.dataset.size)));
document.getElementById('evMinus').addEventListener('click', () => setEvents(state.events - 1));
document.getElementById('evPlus').addEventListener('click', () => setEvents(state.events + 1));
// let the user type a number directly
evInput.addEventListener('input', () => {
  const clean = evInput.value.replace(/[^0-9]/g, '');
  if (clean !== evInput.value) evInput.value = clean;
  const n = clean === '' ? 0 : parseInt(clean, 10);
  const up = n > state.events;
  state.events = n;
  syncBlips(n); updateTag(n);
  clearTimeout(rollTimer);
  if (up){ triggerAlert(); rollTimer = setTimeout(() => renderNumber(n), 1300); }
  else renderNumber(n);
});
evInput.addEventListener('blur', () => setEvents(state.events));
document.getElementById('exportMp4').addEventListener('click', downloadVideo);
document.getElementById('exportHtml').addEventListener('click', downloadHtml);

function downloadVideo(){
  const btn = document.getElementById('exportMp4'), label = btn.querySelector('.t');
  const stream = cnv.elt.captureStream(60);
  const types = ['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4',
                 'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime = types.find(x => MediaRecorder.isTypeSupported(x)) || 'video/webm';
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    recording = false;
    const url = URL.createObjectURL(new Blob(chunks, { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = 'cloaked-scanning-card.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    btn.disabled = false; label.textContent = 'MP4';
  };
  btn.disabled = true; label.textContent = 'Recording…';
  recording = true; rec.start();
  setTimeout(() => rec.stop(), LOOP * 1000);
}

function downloadHtml(){
  const url = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + document.documentElement.outerHTML], { type:'text/html' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'cloaked-scanning-card.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// init
setSize(100); setShowUI(true); setEvents(0);
</script>

<style>
  /* EMBED OVERRIDES — hide editor chrome, center & fit card (immune to editor inline styles) */
  #panel, #toggle { display:none !important; }
  #app { display:block !important; padding:0 !important; min-height:0 !important; }
  #stageWrap { position:fixed; inset:0; display:block !important; }
  #card {
    position:absolute !important; left:50% !important; top:50% !important; margin:0 !important;
    transform: translate(-50%, -50%) scale(var(--fit, 0.24)) !important;
    transition: none !important;
  }
  html, body { background:transparent !important; overflow:hidden; }
  html.breach-bg #overlay { display:none !important; }
</style>
<script>
  (function(){
    /* MZ-18 · `?mode=breach` — the family board's Breach alert tile reuses this
       radar as a full-bleed BACKGROUND. Two differences from the Home tile:
       ① COVER, not contain. The card is authored 692x800; `min()` fits it
          inside and leaves black bars either side of a 353x190 tile, `max()`
          fills the width and lets the height overflow (the tile clips).
       ② no overlay. The count and the label are drawn by the PAGE, not in
          here — cover scaling pushes this card's own overlay off the top, and
          the page already holds the number. I first added an `ssn-set` message
          so the parent could set the count in here; that turned out to be
          solving the wrong half, so it is gone rather than left lying around. */
    var BREACH = /(^|[?&])mode=breach(&|$)/.test(location.search);
    if (BREACH) document.documentElement.classList.add('breach-bg');
    function fit(){
      var s = BREACH
        ? Math.max(window.innerWidth / 692, window.innerHeight / 800)
        : Math.min(window.innerWidth / 692, window.innerHeight / 800);
      document.documentElement.style.setProperty('--fit', s);
    }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    fit();
    /* re-check a few times — lazy iframes can finish layout after load */
    var n = 0, iv = setInterval(function(){ fit(); if (++n > 12) clearInterval(iv); }, 250);
    /* Parent triggers a "scan found an event": bloom + tag flips to Event found + number rolls */
    window.addEventListener('message', function(e){
      if (e.data && e.data.type === 'ssn-event') {
        try { setEvents(state.events + 1); } catch (err) {}
      }
    });
  })();
</script>

</body>
