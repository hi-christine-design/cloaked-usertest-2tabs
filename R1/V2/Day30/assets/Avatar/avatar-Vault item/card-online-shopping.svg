<svg width="80" height="54" viewBox="0 0 80 54" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Online Shopping's card, as a badge. A CARD, not a disc: Figma 6673:220340
     draws the transaction badge as the card itself, and a payment card is a
     landscape rectangle wherever else it appears in this app (the 40x26 row
     tile, the 353x232 face). It was a 40x40 circle, which is why Yuan could
     not tell it was a card at all. 80x54 is card-dating.png's own size, so the
     two card badges are the same object at the same aspect.
     Both colours come from the card record in app.html: ground #8f4e1c, mark
     #c9a0ee. The mark is the Cloaked logo (assets/CloakedPay/Cloaked Logo.svg,
     16x12) at 45% of the card's width, NOT the 32.5% the face uses: the badge
     renders at 22px, where 32.5% is a 7px mark and reads as a speck. The face
     has 353px to play with and the badge has 22. -->
<rect x="0" y="0" width="80" height="54" rx="8" fill="#8F4E1C"/>
