<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN — Globe visualization</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#cfccc4;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;padding:24px;}
  .ph{position:relative;width:360px;height:740px;background:#F3F1ED;border:1px solid rgba(0,0,0,0.08);border-radius:30px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.18);}
  .ph canvas{position:absolute;inset:0;z-index:0;}
  .fade{position:absolute;left:0;right:0;bottom:0;height:330px;z-index:1;background:linear-gradient(to bottom,rgba(243,241,237,0) 0%,rgba(243,241,237,0.7) 46%,#F3F1ED 80%);pointer-events:none;}
  .hdr{position:absolute;top:0;left:0;right:0;z-index:3;background:#F3F1ED;padding:46px 22px 0;}
  .hdr h1{font-size:25px;font-weight:600;color:#23221F;margin:0 0 18px;}
  .tabs{display:flex;gap:26px;border-bottom:1px solid rgba(0,0,0,0.07);}
  .tab{font-size:16px;color:#A6A299;padding-bottom:11px;}
  .tab.on{color:#23221F;border-bottom:2px solid #23221F;}
  .chips{position:absolute;top:184px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:9px 16px;}
  .flag{width:24px;height:18px;display:block;border-radius:0;object-fit:cover;}
  .city{font-size:16px;font-weight:500;color:#1c1b18;white-space:nowrap;line-height:1;}
  .ch{display:inline-block;color:#1c1b18;font-weight:400;filter:blur(0);text-shadow:none;transition:filter .45s,color .45s,text-shadow .45s,font-weight .45s;}
  .ch.scram{color:#E07B28;font-weight:600;filter:blur(1.6px);text-shadow:0 0 6px rgba(224,123,40,0.6);}
  .foot{position:absolute;left:0;right:0;bottom:104px;z-index:3;padding:0 20px;}
  .foot h2{font-size:28px;line-height:1.22;font-weight:400;color:#26251F;margin:0 0 20px;}
  .cta{width:100%;height:56px;display:flex;align-items:center;justify-content:center;background:#006166;color:#fff;border:none;border-radius:999px;padding:0 20px;font-size:16px;font-weight:400;line-height:1.3;letter-spacing:-0.32px;font-family:inherit;-webkit-tap-highlight-color:transparent;}
  .cta:hover,.cta:active,.cta:focus{background:#006166;outline:none;}
  .nav{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;border-top:1px solid rgba(11,11,10,0.15);display:flex;justify-content:space-between;padding:16px 24px 24px;}
  .nav svg{box-sizing:content-box;width:24px;height:24px;padding:12px;stroke:#1c1b18;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0.3;}
  .nav svg.act{opacity:1;fill:#1c1b18;}
</style>
<style>
  body{background:#F3F1ED;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:0;}
  .viz{position:relative;width:360px;height:440px;overflow:hidden;background:#F3F1ED;}
  .ph{position:absolute;top:-150px;left:0;width:360px;height:740px;background:#F3F1ED;border:none;border-radius:0;box-shadow:none;overflow:hidden;}
</style>
</head>

    if(useD3){var c=projection([lon,lat]);if(!c)return{vis:false};return{x:c[0],y:c[1],vis:d3.geoDistance([lon,lat],[cLon,lat0])<Math.PI/2};}
    var lam=(lon-cLon)*D2R,ph=lat*D2R,p0=lat0*D2R;
    var cosc=Math.sin(p0)*Math.sin(ph)+Math.cos(p0)*Math.cos(ph)*Math.cos(lam);
    var x=Math.cos(ph)*Math.sin(lam),y=Math.cos(p0)*Math.sin(ph)-Math.sin(p0)*Math.cos(ph)*Math.cos(lam);
    return{x:cx+R*x,y:cy-R*y,vis:cosc>=0};
  }
  function dot(p,r,c,a){ctx.globalAlpha=a;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=c;ctx.fill();ctx.globalAlpha=1;}
  function seg(pts){ctx.beginPath();var pen=false;for(var i=0;i<pts.length;i++){var p=pts[i];if(!p.vis){pen=false;continue;}if(!pen){ctx.moveTo(p.x,p.y);pen=true;}else ctx.lineTo(p.x,p.y);}ctx.stroke();}
  function manualGrat(){var a,lo,la,pts;ctx.strokeStyle='rgba(120,118,110,0.14)';ctx.lineWidth=1;for(lo=-180;lo<180;lo+=20){pts=[];for(a=-90;a<=90;a+=4)pts.push(proj(lo,a));seg(pts);}for(la=-60;la<=60;la+=20){pts=[];for(a=-180;a<=180;a+=4)pts.push(proj(a,la));seg(pts);}}
  function drawScan(now){
    if(scanStart<0)return;var t=(now-scanStart)/1300,fade=1;
    if(t>=1){var ft=(now-scanStart-1300)/520;if(ft>=1){scanStart=-1;return;}fade=1-ft;t=1;}
    var e=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2,w=cx-R-30+e*(2*R+60);
    for(var i=0;i<grid.length;i++){var p=proj(grid[i][0],grid[i][1]);if(!p.vis)continue;
      if(p.x<-30||p.x>W+30||p.y<-30||p.y>H+30)continue;
      var dx=p.x-w;if(dx>18)continue;var band=Math.max(0,1-Math.abs(dx)/70);
      var dc=Math.hypot(p.x-cx,p.y-cy)/R,cf=clamp(1-dc*0.8,0.2,1);
      var base=(3.5+grid[i][2]*4.5)*cf,a=(dx>0?band:1)*(0.5+grid[i][2]*0.4)*fade;
      if(a<=0.02)continue;dot(p,base*(1+band*1.3),'#2F97AD',a);}
  }
  function frame(now){
    var dL=((targetLon-cLon+540)%360)-180;cLon+=dL*0.085;lat0+=(targetLat-lat0)*0.085;
    if(useD3)projection.rotate([-cLon,-lat0]);
    ctx.clearRect(0,0,W,H);
    var grd=ctx.createRadialGradient(cx-R*0.32,cy-R*0.34,R*0.15,cx,cy,R*1.04);
    grd.addColorStop(0,'#F3F1ED');grd.addColorStop(1,'#F3F1ED');
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle=grd;ctx.fill();
    if(useD3&&land){
      ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
      ctx.beginPath();pathGen(land);ctx.strokeStyle='#C1C2BD';ctx.lineWidth=0.55;ctx.stroke();
      ctx.restore();
    }else if(!useD3)manualGrat();
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.strokeStyle='#C1C2BD';ctx.lineWidth=1;ctx.stroke();
    if(active){var ap=proj(active.lon,active.lat);if(ap.vis){
      ctx.beginPath();ctx.moveTo(cx,224);ctx.lineTo(ap.x,ap.y);ctx.strokeStyle='rgba(50,48,44,0.5)';ctx.lineWidth=1;ctx.stroke();
      var g2=ctx.createRadialGradient(ap.x,ap.y,1,ap.x,ap.y,20);g2.addColorStop(0,'rgba(0,168,177,0)');g2.addColorStop(0.6,'rgba(0,168,177,0.16)');g2.addColorStop(0.88,'rgba(0,168,177,0.6)');g2.addColorStop(1,'rgba(0,168,177,0.95)');ctx.fillStyle=g2;ctx.beginPath();ctx.arc(ap.x,ap.y,20,0,7);ctx.fill();}}
    for(var i=0;i<servers.length;i++){var s=servers[i],p=proj(s.lon,s.lat);if(!p.vis)continue;var act=s===active;dot(p,act?4.5:2.8,'#2F8E9E',act?1:0.8);}
    requestAnimationFrame(frame);
  }
  function clearTimers(){timers.forEach(function(t){clearInterval(t);clearTimeout(t);});timers=[];}
  function setLocation(s){
    document.getElementById('g-flag').src='https://flagcdn.com/w40/'+s.iso+'.png';
    clearTimers();var host=document.getElementById('g-city');host.innerHTML='';var spans=[];var text=s.city;
    for(var i=0;i<text.length;i++){var ch=text[i],el=document.createElement('span');el.className='ch';if(ch===' ')el.innerHTML='&nbsp;';else el.textContent=ch;host.appendChild(el);spans.push([el,ch]);}
    for(var j=0;j<spans.length;j++){(function(el,ch,k){if(!/[A-Za-zÀ-ÿ]/.test(ch))return;
      var start=setTimeout(function(){el.className='ch scram';var iv=setInterval(function(){el.textContent=glyph[(Math.random()*glyph.length)|0];},85);timers.push(iv);
        var end=setTimeout(function(){clearInterval(iv);el.textContent=ch;el.className='ch';},360);timers.push(end);},k*70);timers.push(start);
    })(spans[j][0],spans[j][1],j);}
  }
  function nextApparent(){pi+=dir;if(pi>order.length-1){pi=order.length-2;dir=-1;}if(pi<0){pi=1;dir=1;}active=order[pi];targetLon=active.lon;targetLat=clamp(active.lat-30,-58,60);setLocation(active);}
  scanStart=(window.performance&&performance.now)?performance.now():0;
  setTimeout(function loop(){nextApparent();setTimeout(loop,2000);},1400);
  resize();requestAnimationFrame(frame);
})();
</script>
