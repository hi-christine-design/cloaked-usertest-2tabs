<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Identity Round 2 · Start</title>
<!-- Christine, 21 Oct (Figma 9714:69420): the start page on a phone. Two cards,
     Day 01 (its onboarding) and Day 30, each with a live, scaled preview of the
     build; a tap opens it full screen. Inside a build, a two-finger long press
     anywhere opens the menu (ut2.js) to come back here or switch days.
     The 393x852 frame is scaled to the viewport so the layout reads as drawn. -->
<style>
  html, body { margin: 0; height: 100%; background: #1b1b18; overflow: hidden; -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .frame { position: absolute; left: 50%; top: 50%; width: 393px; height: 852px; transform-origin: 0 0; }
  .hint { position: absolute; left: 20px; top: 175px; width: 353px; height: 43px; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, .1); border-radius: 16px;
    padding: 11px 12.5px; font-size: 16px; line-height: 1.3; letter-spacing: -0.64px; white-space: nowrap; }
  .card { position: absolute; top: 393px; width: 173px; height: 404px; border-radius: 16px; background: #202020; border: 0; padding: 0; text-align: left; cursor: pointer;
    -webkit-tap-highlight-color: transparent; color: #fff; font: inherit; display: block; }
  .card.d1 { left: 20px; } .card.d30 { left: 201px; }
  .card:active { background: #2a2a2a; }
  .card .l { position: absolute; left: 9px; top: 13px; font-size: 12px; line-height: 1.2; letter-spacing: 0; white-space: nowrap; }
  .card .pv { position: absolute; left: 4px; top: 41px; width: 165px; height: 359px; border-radius: 12px; overflow: hidden; background: #1e1e1e; pointer-events: none; }
  .card .pv iframe { position: absolute; left: 0; top: 0; width: 393px; height: 852px; border: 0; transform: scale(0.41985); transform-origin: 0 0; pointer-events: none; background: #1e1e1e; }
  .card .pv::after { content: ''; position: absolute; inset: 0; }   /* the preview is a picture: the card takes the tap */
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="hint">Two-finger long press anywhere  to open menu</div>
  <button type="button" class="card d1" data-go="DayOne"><span class="l">Day 01 - Onboarding</span><span class="pv"><iframe id="pv1" title="Day 01 preview" tabindex="-1"></iframe></span></button>
  <button type="button" class="card d30" data-go="Day30"><span class="l">Day 30</span><span class="pv"><iframe id="pv30" title="Day 30 preview" tabindex="-1"></iframe></span></button>
</div>
<script>
(function () {
  var V = '20261021-ut97';
  /* Same entry as the desktop launcher with Skip onboarding Off.
     skip=1 is that launcher's entry flag; it is not read by the build and
     does not hide Day 01's welcome. intro=0 is what skips it, and this page
     never sends it. ut2m=1 is only the phone's two-finger menu. */
  var Q = '?skip=1&tab=home&ut2=after&ut2name=identity&ut2cards=tab&ut2intro=outside&ut2m=1&v=' + V;
  var URL = { DayOne: 'V2/DayOne/app.html' + Q, Day30: 'V2/Day30/app.html' + Q };
  function fit() {
    var s = Math.min(innerWidth / 393, innerHeight / 852);
    var f = document.getElementById('frame');
    f.style.transform = 'translate(' + (-393 * s / 2) + 'px,' + (-852 * s / 2) + 'px) scale(' + s + ')';
  }
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', fit);
  /* the previews are the builds themselves, scaled; Day 01 shows its onboarding */
  document.getElementById('pv1').src = URL.DayOne + '&ut2pv=1';
  document.getElementById('pv30').src = URL.Day30 + '&ut2pv=1';
  document.addEventListener('click', function (e) {
    var c = e.target.closest && e.target.closest('.card[data-go]'); if (!c) return;
    location.href = URL[c.dataset.go];
  });
})();
</script>
</body>
</html>
